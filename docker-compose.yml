name: shopfloorpilot

services:
  # Base unique : SQL (entrepôt), plein texte et vecteurs (pgvector).
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la création du volume.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage objet compatible S3 (remplace MinIO, dont les images ne sont plus publiées :
  # voir docs/adr/0001-socle-du-depot.md). `weed mini` = tout SeaweedFS dans un conteneur.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55  # à figer sur une version précise (ADR 0001)
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      # Identifiants S3 initiaux ; sans eux, SeaweedFS accepterait tout le monde.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # Bucket(s) créés au démarrage ; opération idempotente (pas d'erreur s'il existe).
      S3_BUCKET: ${S3_BUCKET:-raw}
    ports:
      - "${S3_PORT:-8333}:8333"  # API S3
      - "8888:8888"               # interface web du filer (parcourir les fichiers)
    volumes:
      - seaweeddata:/data
    healthcheck:
      # Le maître répond ET le port S3 accepte les connexions.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9333/cluster/status && nc -z localhost 8333"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  seaweeddata:
