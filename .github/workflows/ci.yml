name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Qualité du code Python : même chose que `make check` en local.
  quality:
    name: Lint, typage, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov=shopfloorpilot

  # 2) Aucun secret commité, sur tout l'historique (fetch-depth: 0).
  secrets:
    name: Scan des secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3) La stack Docker démarre vraiment : pgvector disponible, bucket S3 créé.
  stack:
    name: Démarrage de la stack Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres seaweedfs
      - name: pgvector est installé
        run: |
          docker compose exec -T postgres sh -c \
            'psql -U $POSTGRES_USER -d $POSTGRES_DB -tAc "SELECT extversion FROM pg_extension WHERE extname = '"'"'vector'"'"'"' \
            | grep -E '^[0-9]'
      - name: le bucket S3 « raw » existe
        run: echo "s3.bucket.list" | docker compose exec -T seaweedfs weed shell | grep -w raw
      - if: always()
        run: docker compose down -v
