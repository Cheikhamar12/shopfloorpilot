[project]
name = "shopfloorpilot"
version = "0.1.0"
description = "Copilote agentique pour un industriel multi-sites (TRS + supply chain)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
shopfloorpilot-datagen = "shopfloorpilot.datagen.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopfloorpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["shopfloorpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: nécessite les services Docker (make up)"]
